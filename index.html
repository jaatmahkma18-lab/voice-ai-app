
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darling AI Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; max-width: 500px; margin: 50px auto; padding: 20px; }
    #chat { height: 350px; border: 1px solid #333; overflow-y: auto; padding: 10px; background: #1e1e1e; border-radius: 8px; margin-bottom: 15px; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 6px; word-break: break-word; }
    .user { background: #007bff; text-align: right; }
    .bot { background: #333; text-align: left; }
    .inputs { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; outline: none; }
    button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; background: #28a745; color: #fff; font-weight: bold; }
    button.mic { background: #dc3545; }
  </style>
</head>
<body>
  <h2>Darling AI Chat</h2>
  <div id="chat"></div>
  <div class="inputs">
    <input type="text" id="userInput" placeholder="Type or click Speak..." onkeydown="if(event.key === 'Enter') sendMsg();" />
    <button onclick="sendMsg()">Send</button>
    <button class="mic" onclick="startListening()">🎤 Speak</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const userInput = document.getElementById('userInput');

    function addMessage(sender, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerText = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'hi-IN'; // हिंदी/इंग्लिश दोनों सपोर्ट करेगा
        window.speechSynthesis.speak(speech);
      }
    }

    async function sendMsg() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage('user', text);
      userInput.value = '';

      const loadingId = 'loading_' + Date.now();
      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'msg bot';
      loadingMsg.id = loadingId;
      loadingMsg.innerText = 'Thinking...';
      chat.appendChild(loadingMsg);
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        
        const data = await response.json();
        document.getElementById(loadingId).remove();

        const reply = data.reply || data.error || 'No response received.';
        addMessage('bot', reply);
        speakText(reply);
      } catch (err) {
        document.getElementById(loadingId).remove();
        addMessage('bot', 'Network Error. Please try again.');
      }
    }

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Voice input is not supported in this browser. Please use Google Chrome.');
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-IN'; 
      recognition.onresult = (event) => {
        userInput.value = event.results[0][0].transcript;
        sendMsg();
      };
      recognition.onerror = (event) => {
        if(event.error !== 'aborted') {
            console.error('Mic error:', event.error);
        }
      };
      recognition.start();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice AI Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; max-width: 500px; margin: 50px auto; padding: 20px; }
    #chat { height: 350px; border: 1px solid #333; overflow-y: auto; padding: 10px; background: #1e1e1e; border-radius: 8px; margin-bottom: 15px; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 6px; }
    .user { background: #007bff; text-align: right; }
    .bot { background: #333; text-align: left; }
    .inputs { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
    button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; background: #28a745; color: #fff; }
    button.mic { background: #dc3545; }
  </style>
</head>
<body>
  <h2>AI Voice Chat</h2>
  <div id="chat"></div>
  <div class="inputs">
    <input type="text" id="userInput" placeholder="Type or click Speak..." />
    <button onclick="sendMsg()">Send</button>
    <button class="mic" onclick="startListening()">🎤 Speak</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const userInput = document.getElementById('userInput');

    function addMessage(sender, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerText = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function speakText(text) {
      window.speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(speech);
    }

    async function sendMsg() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage('user', text);
      userInput.value = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await response.json();
        const reply = data.reply || 'Error processing response.';

        addMessage('bot', reply);
        speakText(reply);
      } catch (err) {
        addMessage('bot', 'Network or connection error.');
      }
    }

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Voice input is not supported in this browser.');
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.onresult = (event) => {
        userInput.value = event.results[0][0].transcript;
        sendMsg();
      };
      recognition.start();
    }
  </script>
</body>
</html>
